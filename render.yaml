databases:
  - name: real-estate-db
    databaseName: real_estate
    plan: free

services:
  - type: web
    name: real-estate-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn real_estate.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
